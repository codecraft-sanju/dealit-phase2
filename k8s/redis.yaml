apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealit-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        # ADDED: Memory limit and eviction policy so it never crashes your t2.micro
        command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
        resources:
          limits:
            memory: "256Mi"
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: dealit-redis
spec:
  selector:
    app: redis
  # Ports 6379 expose karne ki zaroorat nahi hai bahar ke liye,
  # kyunki backend Docker network ke andar se hi connect kar lega.
  # networks define karna zaroori hai taaki containers 'redis' name se connect kar sakein
  ports:
  - port: 6379
    targetPort: 6379