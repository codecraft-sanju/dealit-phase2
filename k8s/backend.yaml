apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealit-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: YOUR_REGISTRY/dealit-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_URL
          value: "redis://dealit-redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: dealit-backend
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000